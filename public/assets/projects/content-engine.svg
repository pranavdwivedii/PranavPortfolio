<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Grid -->
  <rect width="1200" height="650" fill="#0d0e12" rx="8"/>
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="650" fill="url(#gridPattern)"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#13151b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="36" cy="30" r="6" fill="#ef4444"/>
  <circle cx="56" cy="30" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="30" r="6" fill="#10b981"/>

  <text x="110" y="35" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Enterprise Content Engine · Microservices Backend Architecture (Java 17 / Spring Boot)</text>
  <rect x="1040" y="16" width="124" height="28" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <text x="1052" y="35" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● LIVE RUNTIME</text>

  <!-- Node 1: High-Volume Feed Ingestion -->
  <g transform="translate(60, 120)">
    <rect width="300" height="460" rx="8" fill="#151720" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
    <rect x="20" y="20" width="260" height="36" rx="4" fill="rgba(59, 130, 246, 0.1)"/>
    <text x="32" y="44" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">01 / INGESTION STREAM</text>

    <!-- Sub items -->
    <g transform="translate(20, 80)">
      <rect width="260" height="80" rx="6" fill="#1b1e2b" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="32" fill="#f3f4f6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Multi-Channel Feeds</text>
      <text x="16" y="56" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Enterprise RSS, REST &amp; Webhook Feeds</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="260" height="80" rx="6" fill="#1b1e2b" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="32" fill="#f3f4f6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Schema Validation</text>
      <text x="16" y="56" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Jakarta Validation &amp; Payload Sanitization</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="260" height="130" rx="6" fill="#1b1e2b" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="30" fill="#f3f4f6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Concurrent Dispatcher</text>
      <text x="16" y="52" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Thread Pool Executor</text>
      <rect x="16" y="70" width="228" height="24" rx="3" fill="rgba(59, 130, 246, 0.15)"/>
      <text x="24" y="86" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11">Throughput: 10K+ events/sec</text>
      <rect x="16" y="100" width="228" height="18" rx="3" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="24" y="113" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10">Zero I/O Deadlock</text>
    </g>
  </g>

  <!-- Connectors 1 -> 2 -->
  <path d="M 360 350 L 440 350" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="440" cy="350" r="4" fill="#3b82f6"/>

  <!-- Node 2: Spring Boot Microservices Core -->
  <g transform="translate(450, 120)">
    <rect width="360" height="460" rx="8" fill="#151720" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2"/>
    <rect x="20" y="20" width="320" height="36" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="32" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">02 / SPRING BOOT CORE (JAVA 17)</text>

    <!-- Service 1 -->
    <g transform="translate(20, 80)">
      <rect width="320" height="100" rx="6" fill="#1a221f" stroke="rgba(16, 185, 129, 0.2)"/>
      <text x="16" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Content Processing Engine</text>
      <text x="16" y="52" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Asynchronous Transformation Pipelines</text>
      <text x="16" y="74" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11">@Service · @Async · CompletableFuture</text>
    </g>

    <!-- Service 2 -->
    <g transform="translate(20, 195)">
      <rect width="320" height="100" rx="6" fill="#1a221f" stroke="rgba(16, 185, 129, 0.2)"/>
      <text x="16" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Spring Data JPA &amp; Hibernate</text>
      <text x="16" y="52" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Complex Relational Entity Mappings</text>
      <text x="16" y="74" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11">@Entity · 1:N / N:M · Dirty Checking</text>
    </g>

    <!-- Service 3 -->
    <g transform="translate(20, 310)">
      <rect width="320" height="110" rx="6" fill="#1a221f" stroke="rgba(16, 185, 129, 0.2)"/>
      <text x="16" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Spring Security &amp; REST Layer</text>
      <text x="16" y="52" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">JWT Authentication &amp; RBAC Authorization</text>
      <rect x="16" y="68" width="288" height="26" rx="4" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="24" y="86" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Modular RESTful API Endpoints</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3 -->
  <path d="M 810 350 L 890 350" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="890" cy="350" r="4" fill="#f43f5e"/>

  <!-- Node 3: Oracle DB Persistence -->
  <g transform="translate(900, 120)">
    <rect width="240" height="460" rx="8" fill="#151720" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.5"/>
    <rect x="20" y="20" width="200" height="36" rx="4" fill="rgba(244, 63, 94, 0.1)"/>
    <text x="30" y="44" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">03 / ORACLE DB</text>

    <!-- Storage Items -->
    <g transform="translate(20, 80)">
      <rect width="200" height="90" rx="6" fill="#201a1c" stroke="rgba(244, 63, 94, 0.2)"/>
      <text x="14" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Relational Schemas</text>
      <text x="14" y="50" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11.5">Normalized Entity Tables</text>
      <text x="14" y="72" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10.5">ACID Compliance</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="200" height="90" rx="6" fill="#201a1c" stroke="rgba(244, 63, 94, 0.2)"/>
      <text x="14" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Materialized Views</text>
      <text x="14" y="50" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11.5">Precomputed Aggregates</text>
      <text x="14" y="72" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10.5">+40% Faster Lookups</text>
    </g>

    <g transform="translate(20, 290)">
      <rect width="200" height="130" rx="6" fill="#201a1c" stroke="rgba(244, 63, 94, 0.2)"/>
      <text x="14" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Connection Pool</text>
      <text x="14" y="50" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11.5">HikariCP Auto-Tuning</text>
      <rect x="14" y="68" width="172" height="24" rx="3" fill="rgba(244, 63, 94, 0.15)"/>
      <text x="20" y="84" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10.5">Zero Leakage Pool</text>
      <rect x="14" y="98" width="172" height="20" rx="3" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="20" y="112" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">High Concurrency Safe</text>
    </g>
  </g>
</svg>
